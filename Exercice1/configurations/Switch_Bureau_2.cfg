! ============================================================================
! EXERCICE 1 - Switch du bureau 2
! Modèle recommandé : Cisco 2960-24TT (ou Switch-PT équivalent)
! Câblage : Fa0/1 <-> SW-BUREAU-1 Fa0/9
!           Fa0/9 <-> SW-BUREAU-3 Fa0/1
! ============================================================================

enable
configure terminal
!
hostname SW-BUREAU-2
no ip domain-lookup
service password-encryption
enable secret C1sco!2026
!
vlan 10
 name WIFI
vlan 20
 name PC_FIXES
vlan 30
 name ADMINISTRATION
!
interface FastEthernet0/1
 description TRUNK_VERS_SW-BUREAU-1_FA0/9
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,10,20,30
!
interface FastEthernet0/9
 description TRUNK_VERS_SW-BUREAU-3_FA0/1
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,10,20,30
!
interface range FastEthernet0/2 - 3
 description TELEPHONES_IP_VOIP_VLAN1
 switchport mode access
 switchport access vlan 1
 spanning-tree portfast
!
interface range FastEthernet0/4 - 5
 description POINTS_ACCES_WIFI_VLAN10
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
interface range FastEthernet0/6 - 7
 description PC_FIXES_VLAN20
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
interface FastEthernet0/8
 description ADMINISTRATION_VLAN30
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
!
interface vlan 30
 ip address 192.168.30.3 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.30.1
!
end
write memory
!
! Verification :
! show vlan brief
! show interfaces trunk
! ping 192.168.30.1
! ping 192.168.30.2
