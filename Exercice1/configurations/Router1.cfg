! ============================================================================
! EXERCICE 1 - Configuration routeur R1 (Cisco 1941)
! Rôle : inter-VLAN (router-on-a-stick), DHCP, passerelle Internet.
! -----------------------------------------------------------------------------
! Câblage : GigabitEthernet0/0 <-> SW-BUREAU-1 FastEthernet0/1 (trunk)
!           GigabitEthernet0/1 <-> R-ISP GigabitEthernet0/0 (WAN)
! ============================================================================

enable
configure terminal
!
hostname R1-MINILAB
no ip domain-lookup
service password-encryption
enable secret C1sco!2026
banner motd ^C
ACCES AUTORISE UNIQUEMENT - MINI-LAB EXERCICE 1
^C
!
! --------------------------
! Routeur vers les VLAN
! --------------------------
interface GigabitEthernet0/0
 description TRUNK_802.1Q_VERS_SW-BUREAU-1_FA0/1
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.1
 description VLAN_1_VOIP_NATIVE
 encapsulation dot1Q 1 native
 ip address 192.168.0.1 255.255.255.0
!
interface GigabitEthernet0/0.10
 description VLAN_10_WIFI_SELON_AFFECTATION_DES_PORTS
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
!
interface GigabitEthernet0/0.20
 description VLAN_20_PC_FIXES_SELON_AFFECTATION_DES_PORTS
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
!
interface GigabitEthernet0/0.30
 description VLAN_30_ADMINISTRATION
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
!
! --------------------------
! Acces Internet simule
! --------------------------
interface GigabitEthernet0/1
 description LIEN_WAN_VERS_R-ISP_G0/0
 ip address 209.165.200.225 255.255.255.224
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 209.165.200.254
!
! --------------------------
! DHCP : seules les adresses .10 a .50 sont attribuables.
! --------------------------
ip dhcp excluded-address 192.168.0.1 192.168.0.9
ip dhcp excluded-address 192.168.0.51 192.168.0.254
ip dhcp excluded-address 192.168.10.1 192.168.10.9
ip dhcp excluded-address 192.168.10.51 192.168.10.254
ip dhcp excluded-address 192.168.20.1 192.168.20.9
ip dhcp excluded-address 192.168.20.51 192.168.20.254
ip dhcp excluded-address 192.168.30.1 192.168.30.9
ip dhcp excluded-address 192.168.30.51 192.168.30.254
!
ip dhcp pool VOIP_VLAN1
 network 192.168.0.0 255.255.255.0
 default-router 192.168.0.1
 dns-server 198.51.100.10
 domain-name minilab.local
!
ip dhcp pool WIFI_VLAN10
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 198.51.100.10
 domain-name minilab.local
!
ip dhcp pool PC_FIXES_VLAN20
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 198.51.100.10
 domain-name minilab.local
!
ip dhcp pool ADMINISTRATION_VLAN30
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.1
 dns-server 198.51.100.10
 domain-name minilab.local
!
! --------------------------
! Acces console et SSH facultatif
! --------------------------
ip domain-name minilab.local
username admin privilege 15 secret Adm1n!2026
crypto key generate rsa modulus 1024
ip ssh version 2
line console 0
 logging synchronous
 login local
 exec-timeout 10 0
line vty 0 4
 login local
 transport input ssh
!
end
write memory
!
! Verification a executer :
! show ip interface brief
! show ip dhcp binding
! show ip route
! show running-config
