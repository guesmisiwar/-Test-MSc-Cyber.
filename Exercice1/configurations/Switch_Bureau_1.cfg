! ============================================================================
! EXERCICE 1 - Switch du bureau 1
! Modèle recommandé : Cisco 2960-24TT (ou Switch-PT équivalent)
! Câblage : Fa0/1 <-> R1-MINILAB G0/0
!           Fa0/9 <-> SW-BUREAU-2 Fa0/1
! ============================================================================

enable
configure terminal
!
hostname SW-BUREAU-1
no ip domain-lookup
service password-encryption
enable secret C1sco!2026
!
vlan 10
 name WIFI
vlan 20
 name PC_FIXES
vlan 30
 name ADMINISTRATION
!
! Uplinks configures en trunk 802.1Q. VLAN 1 est le VLAN natif.
interface FastEthernet0/1
 description TRUNK_VERS_R1-MINILAB_G0/0
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,10,20,30
!
interface FastEthernet0/9
 description TRUNK_VERS_SW-BUREAU-2_FA0/1
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,10,20,30
!
! Ports pour telephones IP (VoIP) : VLAN 1.
interface range FastEthernet0/2 - 3
 description TELEPHONES_IP_VOIP_VLAN1
 switchport mode access
 switchport access vlan 1
 spanning-tree portfast
!
! Ports 4-5 reserves aux points d'acces Wi-Fi : VLAN 10.
interface range FastEthernet0/4 - 5
 description POINTS_ACCES_WIFI_VLAN10
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
! Ports 6-7 pour PC fixes : VLAN 20.
interface range FastEthernet0/6 - 7
 description PC_FIXES_VLAN20
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
! Port 8 pour un terminal/PC d'administration : VLAN 30.
interface FastEthernet0/8
 description ADMINISTRATION_VLAN30
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
!
! Adresse IP de gestion du switch dans le VLAN d'administration.
interface vlan 30
 ip address 192.168.30.2 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.30.1
!
end
write memory
!
! Verification :
! show vlan brief
! show interfaces trunk
! show ip interface brief
! ping 192.168.30.1
