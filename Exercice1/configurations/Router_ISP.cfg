! ============================================================================
! EXERCICE 1 - Routeur Internet simulé R-ISP
! Ajouté afin de prouver l’accès hors des réseaux LAN.
! -----------------------------------------------------------------------------
! Câblage : G0/0 <-> R1-MINILAB G0/1
!           G0/1 <-> SERVER-INTERNET FastEthernet0
! ============================================================================

enable
configure terminal
!
hostname R-ISP
no ip domain-lookup
!
interface GigabitEthernet0/0
 description VERS_R1-MINILAB_G0/1
 ip address 209.165.200.254 255.255.255.224
 no shutdown
!
interface GigabitEthernet0/1
 description VERS_SERVER-INTERNET
 ip address 198.51.100.1 255.255.255.0
 no shutdown
!
! Route de retour indispensable vers tous les VLAN internes.
ip route 192.168.0.0 255.255.255.0 209.165.200.225
ip route 192.168.10.0 255.255.255.0 209.165.200.225
ip route 192.168.20.0 255.255.255.0 209.165.200.225
ip route 192.168.30.0 255.255.255.0 209.165.200.225
!
end
write memory
!
! Verification :
! show ip route
! ping 209.165.200.225
! ping 192.168.10.1
