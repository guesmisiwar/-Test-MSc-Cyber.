version: '3.8'

services:
  # 1. Base de données (MariaDB)
  db:
    image: mariadb:latest
    container_name: mariadb_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Azerty_2025!
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
    volumes:
      - db_data:/var/lib/mysql

  # 2. Moteur PHP (WordPress FPM) - Correspond à l'image PHP demandée
  wordpress:
    depends_on:
      - db
    image: wordpress:fpm
    container_name: wordpress_php
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_shared_data:/var/www/html # Volume commun pour les data/configs

  # 3. Serveur Web (Nginx)
  nginx:
    depends_on:
      - wordpress
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - wp_shared_data:/var/www/html:ro # Accès au volume commun en lecture seule
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data:
  wp_shared_data: # Définition du volume commun demandé dans l'énoncé
